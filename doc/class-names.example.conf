; Пример ~/.config/shaping-view/class-names.conf
; Секции — имена устройств (как их показывает tc), ключи — classid.
; Если файла нет, карточки показывают авто-тег "prio N · leaf <qdisc>".
; Скопируйте в ~/.config/shaping-view/class-names.conf и правьте под себя.

; Пакировка сайдбара: glob-паттерны через пробел. Первый матч побеждает
; (vpn-server → vpn-client → hardware); всё неопознанное = «Реальное железо».
; tun/tap-устройства без конфига эвристически: tap*/srv → серверы, остальное → клиенты.
[groups]
vpn-server = tap0 tun10
vpn-client = fastvpn-* tun0

[wan0]
1:1 = Канал 99 Мбит
1:10 = DNS / NTP / ICMP (police 10kbit)
1:20 = VPN · HTTPS · LAN 192.168.137.0/24
1:30 = HTTP · 8143 · 7777
1:40 = TeamViewer (5938)
1:50 = резерв
1:60 = Default (всё прочее)
1:70 = Bulk: порты 50000–51001

[wan0_ifb]
1:1 = Канал ↓ 99 Мбит
1:10 = DNS / ICMP ↓
1:20 = VPN · HTTPS ↓
1:30 = HTTP · 8143 ↓
1:40 = TeamViewer ↓
1:50 = резерв ↓
1:60 = Default ↓
1:70 = Bulk ↓

[brlan0]
1:1 = LAN 985 Мбит
1:10 = DNS → LAN (mark 0xb053/0xa053)
1:20 = ICMP
1:30 = Web forward (mark 0xa080/0xa443)
1:40 = Apache/SAMBA локально (mark 0xb0…)
1:50 = Default LAN

[brlan0_loc_ifb]
1:1 = Хост: вход 100 Мбит
1:10 = DNS на хост
1:20 = ICMP на хост
1:30 = Web на хост
1:40 = Default (на хост)

[brlan0_fwr_ifb]
1:1 = Форвард: вход 100 Мбит
1:10 = DNS клиентов
1:20 = ICMP клиентов
1:30 = Web клиентов
1:40 = Default (клиенты)

[tap0]
1:1 = tap0 90 Мбит
1:10 = DNS
1:20 = PING
1:30 = SSH
1:40 = Web
1:50 = SMB
1:60 = Default

[tun10]
1:1 = tun10 90 Мбит
1:10 = DNS
1:20 = PING
1:30 = Web
1:40 = Default

; Для fastvpn-регионов — аналогичные секции:
; [fastvpn-de_ifb] / [fastvpn-fr_ifb] / …
[fastvpn-de_ifb]
1:1 = Туннель ↓
1:10 = DNS ↓
1:20 = 10057 ↓
1:30 = Web ↓
1:40 = Default ↓
